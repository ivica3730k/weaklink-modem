name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "1.8.5"

      - name: Set version from tag
        run: poetry version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: poetry build

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

  build-binary:
    name: Build portable Linux binary (universal)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build standalone onefile binary inside Ubuntu 22.04 baseline
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv \
                libportaudio2 libsndfile1 binutils
              sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install --upgrade pip
              /opt/venv/bin/pip install . pyinstaller
              /opt/venv/bin/pyinstaller \
                --onefile --name weaklink-modem \
                --collect-submodules weaklink \
                --collect-all sounddevice \
                --collect-all soundfile \
                src/weaklink/modem/cli.py
              chmod -R 755 dist/ build/ 2>/dev/null || true
            '

      - name: Smoke-test binary across popular Linux distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim; do
            echo "=== Testing on $image ==="
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/weaklink-modem --help
            echo "=== PASSED: $image ==="
          done

      - name: Create versioned and latest aliases
        run: |
          cp dist/weaklink-modem dist/weaklink-modem-linux-x86_64-${GITHUB_REF_NAME#v}
          cp dist/weaklink-modem dist/weaklink-modem-linux-x86_64-latest

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/weaklink-modem-linux-x86_64-*

  build-binary-arm64:
    name: Build portable Linux binary (arm64, universal)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build standalone onefile binary inside Ubuntu 22.04 baseline
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv \
                libportaudio2 libsndfile1 binutils
              sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install --upgrade pip
              /opt/venv/bin/pip install . pyinstaller
              /opt/venv/bin/pyinstaller \
                --onefile --name weaklink-modem \
                --collect-submodules weaklink \
                --collect-all sounddevice \
                --collect-all soundfile \
                src/weaklink/modem/cli.py
              chmod -R 755 dist/ build/ 2>/dev/null || true
            '

      - name: Smoke-test binary across popular Linux distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim; do
            echo "=== Testing on $image ==="
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/weaklink-modem --help
            echo "=== PASSED: $image ==="
          done

      - name: Create versioned and latest aliases
        run: |
          cp dist/weaklink-modem dist/weaklink-modem-linux-arm64-${GITHUB_REF_NAME#v}
          cp dist/weaklink-modem dist/weaklink-modem-linux-arm64-latest

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/weaklink-modem-linux-arm64-*

  build-deb:
    name: Build amd64 .deb (universal)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Build standalone onefile binary inside Ubuntu 22.04 baseline
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv \
                libportaudio2 libsndfile1 binutils
              sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install --upgrade pip
              /opt/venv/bin/pip install . pyinstaller
              /opt/venv/bin/pyinstaller \
                --onefile --name weaklink-modem \
                --collect-submodules weaklink \
                --collect-all sounddevice \
                --collect-all soundfile \
                src/weaklink/modem/cli.py
              chmod -R 755 dist/ build/ 2>/dev/null || true
            '

      - name: Smoke-test binary across popular Linux distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim; do
            echo "=== Testing on $image ==="
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/weaklink-modem --help
            echo "=== PASSED: $image ==="
          done

      - name: Stage files for packaging
        run: |
          mkdir -p pkgroot/usr/bin
          install -m 0755 dist/weaklink-modem pkgroot/usr/bin/weaklink-modem

      - name: Build .deb
        run: |
          fpm -s dir -t deb \
            -n weaklink-modem \
            -v "${GITHUB_REF_NAME#v}" \
            --description "Streaming MFSK digital modem: bytes-to-audio-and-back byte pipe." \
            --maintainer "Ivica <ivica.matic@groupnexus.co.uk>" \
            --architecture amd64 \
            -C pkgroot \
            usr

      - name: Alias .deb with -latest suffix
        run: cp weaklink-modem_${GITHUB_REF_NAME#v}_amd64.deb weaklink-modem_amd64-latest.deb

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            weaklink-modem_*_amd64.deb
            weaklink-modem_amd64-latest.deb

