                -exec patchelf --remove-rpath {} +
              /opt/venv/bin/pyinstaller \
                --onefile --name weaklink-modem \
                --collect-submodules weaklink \
                --collect-all sounddevice \
                --collect-all soundfile \
                src/weaklink/modem/cli.py
              /opt/venv/bin/staticx dist/weaklink-modem dist/weaklink-modem-static
              mv dist/weaklink-modem-static dist/weaklink-modem
              chmod -R 755 dist/ build/ 2>/dev/null || true
            '

      - name: Smoke-test binary across popular Linux distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim; do
            echo "=== Testing on $image ==="
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/weaklink-modem --help
            echo "=== PASSED: $image ==="
          done

      - name: Create versioned and latest aliases
        run: |
          cp dist/weaklink-modem dist/weaklink-modem-linux-arm64-${{ steps.ver.outputs.version }}
          cp dist/weaklink-modem dist/weaklink-modem-linux-arm64-latest

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/weaklink-modem-linux-arm64-${{ steps.ver.outputs.version }}
            dist/weaklink-modem-linux-arm64-latest

  build-deb:
    name: Build amd64 .deb (universal)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build fully static binary inside Ubuntu 22.04 (glibc 2.35 baseline)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${{ steps.ver.outputs.version }}" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv python3-dev \
                build-essential patchelf libportaudio2 libsndfile1 \
                scons musl-tools
              sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install --upgrade pip
              /opt/venv/bin/pip install . pyinstaller staticx
              find /opt/venv/lib \( -name "*.so" -o -name "*.so.*" \) \
                ! -path "*/site-packages/numpy/*" \
                -exec patchelf --remove-rpath {} +
              /opt/venv/bin/pyinstaller \
                --onefile --name weaklink-modem \
                --collect-submodules weaklink \
                --collect-all sounddevice \
                --collect-all soundfile \
                src/weaklink/modem/cli.py
              /opt/venv/bin/staticx dist/weaklink-modem dist/weaklink-modem-static
              mv dist/weaklink-modem-static dist/weaklink-modem
              chmod -R 755 dist/ build/ 2>/dev/null || true
            '

      - name: Smoke-test binary across popular Linux distributions
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim; do
            echo "=== Testing on $image ==="
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/weaklink-modem --help
            echo "=== PASSED: $image ==="
          done

      - name: Stage files for packaging
        run: |
          mkdir -p pkgroot/usr/bin
          install -m 0755 dist/weaklink-modem pkgroot/usr/bin/weaklink-modem

      - name: Build .deb
        run: |
          fpm -s dir -t deb \
            -n weaklink-modem \
            -v "${{ steps.ver.outputs.version }}" \
            --description "Streaming MFSK digital modem: bytes-to-audio-and-back byte pipe." \
            --maintainer "Ivica <ivica.matic@groupnexus.co.uk>" \
            --architecture amd64 \
            -C pkgroot \
            usr

      - name: Alias .deb with -latest suffix
        run: cp weaklink-modem_${{ steps.ver.outputs.version }}_amd64.deb weaklink-modem_amd64-latest.deb

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            weaklink-modem_${{ steps.ver.outputs.version }}_amd64.deb
            weaklink-modem_amd64-latest.deb

